app:
  name: ToDo
  version: 1

spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/to-do_app
    username: root
    password: ""

  web:
    locale: en
    locale-resolver: fixed

  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8080

springdoc:
  api-docs.path: /api-docs